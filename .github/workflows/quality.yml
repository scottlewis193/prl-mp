name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      PUBLIC_PB_URL: http://127.0.0.1:8090
      PB_USER: ''
      PB_PASS: ''
      DISABLE_AUTH: 'false'
      PUBLIC_VAPID_PUBLIC_KEY: ''
      VAPID_PRIVATE_KEY: ''
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: npm ci

      - name: Install PocketBase
        run: npm run pb:install

      - name: Type-check
        run: npm run check

      - name: Check formatting
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build production application
        run: npm run build
